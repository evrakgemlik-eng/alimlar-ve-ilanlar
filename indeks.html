<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Günlük Uygun İlanlar Paneli</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
    }

    h1 {
      margin: 0;
      color: var(--primary);
      font-size: 24px;
    }

    .date-badge {
      background-color: #dbeafe;
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .job-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .job-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .job-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .job-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px 0;
      color: #0f172a;
    }

    .company {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .match-score {
      display: inline-block;
      background-color: #dcfce7;
      color: #15803d;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .apply-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 6px;
      font-weight: 600;
      margin-top: 10px;
    }

    .apply-btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>📌 Günlük İlan Takip Paneli</h1>
      <span class="date-badge" id="currentDate"></span>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="İlan başlığı, şirket veya anahtar kelime ara..." onkeyup="filterJobs()">

    <div class="job-grid" id="jobGrid">
      <!-- İlanlar buraya dinamik eklenecek -->
    </div>
  </div>

  <script>
    // Tarihi güncelle
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('tr-TR', {
      day: 'numeric', month: 'long', year: 'numeric'
    });

    // Örnek ilan verileri (Buraya API veya Google Sheet üzerinden gelen veriler basılacak)
    const jobs = [
      {
        title: "Kıdemli Yazılım Geliştirici",
        company: "Teknoloji A.Ş.",
        location: "İstanbul (Hibrit)",
        match: "%95 Uygun",
        link: "#"
      },
      {
        title: "Frontend Developer (React)",
        company: "Dijital Ajans",
        location: "Uzaktan (Remote)",
        match: "%88 Uygun",
        link: "#"
      },
      {
        title: "Veri Analisti",
        company: "Finans Grubu",
        location: "Ankara",
        match: "%82 Uygun",
        link: "#"
      }
    ];

    function renderJobs(data) {
      const grid = document.getElementById('jobGrid');
      grid.innerHTML = '';
      
      if(data.length === 0) {
        grid.innerHTML = '<p style="color:#64748b;">Aramanıza uygun ilan bulunamadı.</p>';
        return;
      }

      data.forEach(job => {
        const card = document.createElement('div');
        card.className = 'job-card';
        card.innerHTML = `
          <div class="match-score">🎯 ${job.match}</div>
          <h2 class="job-title">${job.title}</h2>
          <div class="company">🏢 ${job.company} • 📍 ${job.location}</div>
          <a href="${job.link}" target="_blank" class="apply-btn">İlanı İncele</a>
        `;
        grid.appendChild(card);
      });
    }

    function filterJobs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = jobs.filter(j => 
        j.title.toLowerCase().includes(query) || 
        j.company.toLowerCase().includes(query)
      );
      renderJobs(filtered);
    }

    // İlk yüklemede çalıştır
    renderJobs(jobs);
  </script>
</body>
</html>
